<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nexo — پیام‌رسان</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/vazirmatn@5.2.5/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/vazirmatn@5.2.5/500.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/vazirmatn@5.2.5/700.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/vazirmatn@5.2.5/800.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/lalezar@5.2.7/400.css">
<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
:root{--gold:#d4af37;--gold-l:#f7e8ab;--gold-d:#a17c1e;--ggrad:linear-gradient(135deg,#fbeec0 0%,#e8c96a 30%,#d4af37 55%,#9d7a1d 100%);--r-s:10px;--r-m:16px;--r-l:22px;--t:.3s cubic-bezier(.4,0,.2,1);--rail:78px;--list:360px;--ff:'Vazirmatn','Vazir',Tahoma,system-ui,sans-serif;--ffd:'B Titr','BTitr','B Titr Bold','Lalezar','Vazirmatn',Tahoma,sans-serif}
html[data-theme=dark]{--bg:#06060a;--bg2:#0d0d12;--bg3:#14141b;--bg4:#1b1b24;--panel:rgba(255,255,255,.035);--glass:rgba(14,14,20,.78);--line:rgba(212,175,55,.16);--line2:rgba(255,255,255,.07);--txt:#f2eee4;--txt2:#a49c8c;--txt3:#6f6a5e;--in:#16161e;--in-txt:#f2eee4;--out:linear-gradient(155deg,rgba(212,175,55,.28),rgba(212,175,55,.09));--out-txt:#fdf6e2;--hov:rgba(212,175,55,.09);--act:rgba(212,175,55,.17);--sh:0 18px 50px rgba(0,0,0,.65);--sh2:0 6px 22px rgba(0,0,0,.5);--wp:.55;--danger:#ff6b6b;--ok:#4cd97b;--online:#4cd97b}
html[data-theme=light]{--bg:#f7f5f0;--bg2:#fff;--bg3:#faf7ef;--bg4:#f1ecdf;--panel:#fff;--glass:rgba(255,255,255,.86);--line:rgba(160,124,20,.24);--line2:rgba(60,45,10,.1);--txt:#211c11;--txt2:#6d6553;--txt3:#9c9382;--in:#fff;--in-txt:#211c11;--out:linear-gradient(155deg,#ffe9a9,#f3d277);--out-txt:#33290c;--hov:rgba(160,124,20,.09);--act:rgba(160,124,20,.17);--sh:0 18px 44px rgba(120,95,20,.16);--sh2:0 6px 20px rgba(120,95,20,.12);--wp:.4;--danger:#e0453a;--ok:#1fa457;--online:#1fa457}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;font-family:var(--ff);background:var(--bg);color:var(--txt);overflow:hidden;font-size:15px;line-height:1.65;transition:background .4s,color .4s}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
::selection{background:rgba(212,175,55,.32)}
.ic{width:22px;height:22px;flex:0 0 auto;display:block}
.hidden{display:none!important}
.gold-t{background:var(--ggrad);-webkit-background-clip:text;background-clip:text;color:transparent}
.lhead h2,.hero h2,.ihero h2,.mhead h3,.empty h3,.auth-card .brand h1,.sv-text .sv-cap,.st-text{font-family:var(--ffd);font-weight:400}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,rgba(212,175,55,.5),rgba(212,175,55,.18));border-radius:20px;border:2px solid transparent;background-clip:padding-box}
.no-anim *{animation:none!important;transition:none!important}
#auth{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:24px;overflow:auto;background:radial-gradient(1100px 620px at 82% -12%,rgba(212,175,55,.2),transparent 62%),radial-gradient(800px 520px at 8% 112%,rgba(212,175,55,.12),transparent 60%),var(--bg)}
.auth-card{position:relative;width:min(520px,100%);background:var(--glass);backdrop-filter:blur(22px);border:1px solid var(--line);border-radius:28px;padding:34px 30px;box-shadow:var(--sh);animation:up .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes up{from{opacity:0;transform:translateY(26px) scale(.97)}to{opacity:1;transform:none}}
.brand{display:flex;align-items:center;gap:12px}
.brand .mark{width:52px;height:52px}
.brand h1{margin:0;font-size:34px;letter-spacing:2px}
.brand small{display:block;font-size:11px;letter-spacing:3px;color:var(--txt2);font-weight:500}
.auth-card>p{color:var(--txt2);margin:16px 0 22px;font-size:14px}
.field{position:relative;margin-bottom:14px}
.field label{display:block;font-size:12.5px;color:var(--txt2);margin-bottom:6px;font-weight:600}
.inp{width:100%;padding:13px 15px;border-radius:14px;background:var(--bg2);border:1px solid var(--line2);outline:none;transition:var(--t);color:var(--txt)}
.inp:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(212,175,55,.13)}
.inp::placeholder{color:var(--txt3)}
.uname-wrap{display:flex;align-items:center;gap:8px;padding:0 14px;border-radius:14px;background:var(--bg2);border:1px solid var(--line2);transition:var(--t)}
.uname-wrap:focus-within{border-color:var(--gold);box-shadow:0 0 0 4px rgba(212,175,55,.13)}
.uname-wrap span{color:var(--gold);font-weight:700;font-size:17px}
.uname-wrap input{flex:1;border:0;background:none;outline:none;padding:13px 0;direction:ltr;text-align:left}
.auth-tabs{display:flex;gap:8px;justify-content:center;margin:0 0 16px}
.auth-tabs .opt-pill{flex:1;padding:10px 12px;text-align:center}
.pw-ic{display:flex;align-items:center;color:var(--gold)}
.pw-ic .ic{width:18px;height:18px}
.btn{border:0;cursor:pointer;border-radius:14px;padding:13px 20px;font-weight:700;transition:var(--t);display:inline-flex;align-items:center;justify-content:center;gap:9px;position:relative;overflow:hidden}
.btn-gold{background:var(--ggrad);color:#231a03;box-shadow:0 8px 24px rgba(212,175,55,.3)}
.btn-gold:hover{filter:brightness(1.09);transform:translateY(-2px)}
.btn-gold:active{transform:translateY(0) scale(.98)}
.btn-ghost{background:var(--panel);border:1px solid var(--line2);color:var(--txt)}
.btn-ghost:hover{border-color:var(--gold);color:var(--gold)}
.btn-block{width:100%}
.btn-sm{padding:8px 14px;font-size:13px;border-radius:11px}
.err{color:var(--danger);font-size:12.5px;margin:-6px 0 10px;min-height:0;display:none}
.err.show{display:block;animation:shake .4s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.av-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.av-pick{width:46px;height:46px;border-radius:14px;border:2px solid transparent;cursor:pointer;display:grid;place-items:center;font-weight:800;color:#2a2005;transition:var(--t)}
.av-pick.sel{border-color:var(--gold);transform:scale(1.08)}
.avatar{position:relative;border-radius:50%;overflow:hidden;display:grid;place-items:center;font-weight:800;color:#2a2005;flex:0 0 auto;background:var(--ggrad)}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar .on-dot{position:absolute;bottom:1px;left:1px;width:26%;height:26%;min-width:9px;min-height:9px;border-radius:50%;background:var(--online);border:2.5px solid var(--bg2)}
.av-upload{width:46px;height:46px;border-radius:14px;border:1px dashed var(--line);display:grid;place-items:center;cursor:pointer;color:var(--gold);transition:var(--t)}
.av-upload:hover{background:var(--hov)}
#app{position:fixed;inset:0;display:grid;grid-template-columns:var(--rail) var(--list) 1fr;height:100%}
.rail{background:linear-gradient(180deg,var(--bg2),var(--bg));border-inline-start:1px solid var(--line2);display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 0;z-index:20}
.rail .logo{width:42px;height:42px;margin-bottom:12px;cursor:pointer;transition:var(--t);filter:drop-shadow(0 4px 12px rgba(212,175,55,.35))}
.rail .logo:hover{transform:rotate(-8deg) scale(1.08)}
.rbtn{width:52px;height:52px;border-radius:16px;border:0;background:transparent;color:var(--txt2);cursor:pointer;display:grid;place-items:center;position:relative;transition:var(--t)}
.rbtn:hover{background:var(--hov);color:var(--gold)}
.rbtn.on{background:var(--act);color:var(--gold)}
.rbtn.on:before{content:'';position:absolute;top:50%;transform:translateY(-50%);inset-inline-end:-13px;width:4px;height:24px;border-radius:4px;background:var(--ggrad);box-shadow:0 0 14px var(--gold)}
.rbtn .badge{position:absolute;top:5px;inset-inline-start:5px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--ggrad);color:#241b03;font-size:11px;font-weight:800;display:grid;place-items:center;border:2px solid var(--bg2)}
.rail .spacer{flex:1}
.pane{position:relative;min-width:0;display:flex;flex-direction:column;background:var(--bg2);overflow:hidden}
.pane-list{border-inline-start:1px solid var(--line2)}
.pane-chat{background:var(--bg)}
.lhead{padding:14px 16px 10px;display:flex;flex-direction:column;gap:11px;background:var(--bg2);border-bottom:1px solid var(--line2);z-index:5}
.lhead .row{display:flex;align-items:center;gap:10px}
.lhead h2{margin:0;font-size:24px;flex:1;line-height:1.3}
.icon-btn{width:40px;height:40px;border-radius:13px;border:1px solid transparent;background:transparent;color:var(--txt2);cursor:pointer;display:grid;place-items:center;transition:var(--t);position:relative;flex:0 0 auto}
.icon-btn:hover{background:var(--hov);color:var(--gold);border-color:var(--line)}
.search-box{display:flex;align-items:center;gap:9px;background:var(--bg3);border:1px solid var(--line2);border-radius:13px;padding:0 13px;transition:var(--t)}
.search-box:focus-within{border-color:var(--gold);background:var(--bg2)}
.search-box input{flex:1;border:0;background:none;outline:none;padding:10px 0}
.search-box svg{color:var(--txt3)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;padding:6px 14px;border-radius:20px;background:var(--bg3);border:1px solid var(--line2);color:var(--txt2);font-size:12.5px;font-weight:600;cursor:pointer;transition:var(--t)}
.tab:hover{color:var(--gold)}
.tab.on{background:var(--ggrad);color:#241b03;border-color:transparent;box-shadow:0 4px 14px rgba(212,175,55,.28)}
.lbody{flex:1;overflow-y:auto;overflow-x:hidden}
.story-bar{display:flex;gap:15px;align-items:center;padding:13px 14px 11px;border-bottom:1px solid var(--line2);background:var(--bg2);overflow-x:auto;scrollbar-width:none}
.story-bar::-webkit-scrollbar{display:none}
.story-item{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;flex:0 0 auto;transition:var(--t)}
.story-item:hover{transform:translateY(-3px)}
.story-ring{position:relative;padding:2.5px;border-radius:50%;background:conic-gradient(from 210deg,#f7e8ab,#d4af37,#8c6a14,#e8c96a,#f7e8ab);box-shadow:0 3px 12px rgba(212,175,55,.25)}
.story-ring.seen{background:var(--bg4);box-shadow:none}
.story-ring.add{background:var(--bg4);box-shadow:none}
.story-ring .avatar{border:2.5px solid var(--bg2)}
.splus{position:absolute;bottom:-3px;right:-3px;width:21px;height:21px;border-radius:50%;background:var(--ggrad);color:#241b03;font-size:15px;font-weight:800;display:grid;place-items:center;border:2px solid var(--bg2);font-family:var(--ff)}
.sname{font-size:11px;color:var(--txt2);max-width:66px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.story-hint{font-size:12px;color:var(--txt3);padding-inline-start:4px;line-height:1.7}
.story-view{position:fixed;inset:0;z-index:260;background:rgba(0,0,0,.96);display:grid;place-items:center;animation:fade .25s both}
.sv-inner{position:relative;width:min(440px,100%);height:min(94vh,880px);background:#0c0c10;border-radius:24px;overflow:hidden;box-shadow:0 30px 90px rgba(0,0,0,.85);display:flex;flex-direction:column}
.sv-prog{display:flex;gap:4px;padding:10px 12px 6px;position:absolute;top:0;inset-inline:0;z-index:6}
.sp{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.28);overflow:hidden}
.sp i{display:block;height:100%;width:0;background:#fff;border-radius:3px}
.sp.done i{width:100%}
.sp.run i{animation:sprog 5s linear forwards}
@keyframes sprog{to{width:100%}}
.sv-head{position:absolute;top:22px;inset-inline:0;display:flex;align-items:center;gap:10px;padding:8px 12px;z-index:6;color:#fff}
.sv-head .avatar{border:2px solid rgba(255,255,255,.35)}
.sv-hc{flex:1;display:flex;flex-direction:column;line-height:1.35;min-width:0}
.sv-hc b{font-size:14px}
.sv-hc span{font-size:11.5px;opacity:.75}
.sv-head .icon-btn{color:#fff}
.sv-head .icon-btn:hover{background:rgba(255,255,255,.16);color:#fff}
.sv-body{flex:1;position:relative;display:grid;place-items:center;overflow:hidden;background:#111}
.sv-body>img{width:100%;height:100%;object-fit:cover}
.sv-text{display:grid;place-items:center;padding:34px}
.sv-cap{position:absolute;bottom:30px;inset-inline:20px;text-align:center;color:#fff;font-size:16.5px;font-weight:700;text-shadow:0 2px 12px rgba(0,0,0,.7);background:rgba(0,0,0,.38);backdrop-filter:blur(6px);border-radius:14px;padding:10px 14px;z-index:3}
.sv-text .sv-cap{position:static;background:none;font-size:31px;line-height:2;text-shadow:0 3px 18px rgba(0,0,0,.35);color:#fff}
.sv-zone{position:absolute;top:0;bottom:0;width:36%;z-index:5;cursor:pointer}
.sv-zone.prev{inset-inline-start:0}
.sv-zone.next{inset-inline-end:0}
.sv-foot{position:absolute;bottom:9px;inset-inline:14px;z-index:6;display:flex;gap:8px;align-items:center}
.sv-views{display:flex;align-items:center;gap:5px;color:rgba(255,255,255,.9);font-size:12px;background:rgba(0,0,0,.42);padding:4px 11px;border-radius:12px;backdrop-filter:blur(4px)}
.sv-views .ic{width:15px;height:15px}
.story-drop{display:flex;flex-direction:column;align-items:center;gap:9px;padding:28px;border:1.5px dashed var(--line);border-radius:16px;color:var(--gold);cursor:pointer;transition:var(--t);font-weight:700}
#stPrev img{width:100%;max-height:230px;object-fit:cover;border-radius:14px;margin-top:10px}
.st-text{font-size:21px;text-align:center;line-height:2}
.item{display:flex;gap:12px;padding:11px 14px;cursor:pointer;position:relative;transition:background .2s;align-items:center;animation:fadeUp .35s both}
@keyframes fadeUp{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.item:hover{background:var(--hov)}
.item.on{background:var(--act)}
.item.on:before{content:'';position:absolute;inset-block:6px;inset-inline-end:0;width:3px;border-radius:3px;background:var(--ggrad)}
.item .col{flex:1;min-width:0}
.item .top{display:flex;align-items:center;gap:6px}
.item .nm{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.item .tm{font-size:11.5px;color:var(--txt3);flex:0 0 auto}
.item .btm{display:flex;align-items:center;gap:7px;margin-top:2px}
.item .pv{font-size:13px;color:var(--txt2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.item .pv b{color:var(--txt);font-weight:600}
.item.unread .nm{color:var(--gold)}
.badge-n{min-width:21px;height:21px;padding:0 6px;border-radius:11px;background:var(--ggrad);color:#241b03;font-size:11.5px;font-weight:800;display:grid;place-items:center;flex:0 0 auto}
.badge-n.mute{background:var(--bg4);color:var(--txt2)}
.mini{display:flex;align-items:center;gap:3px;color:var(--txt3);flex:0 0 auto}
.mini svg{width:16px;height:16px}
.mini.read{color:var(--gold)}
.type-ic{width:15px;height:15px;color:var(--txt3);flex:0 0 auto}
.sec-title{padding:14px 18px 6px;font-size:12px;font-weight:800;color:var(--gold);letter-spacing:.6px}
.empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:30px;text-align:center;color:var(--txt2)}
.empty svg{width:110px;height:110px;opacity:.85;animation:float 5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-12px)}}
.empty h3{margin:0;color:var(--txt);font-size:20px}
.empty p{margin:0;font-size:13.5px;max-width:300px}
.chead{display:flex;align-items:center;gap:12px;padding:9px 14px;background:var(--glass);backdrop-filter:blur(16px);border-bottom:1px solid var(--line2);z-index:6;min-height:64px}
.chead .info{flex:1;min-width:0;cursor:pointer}
.chead .info h3{margin:0;font-size:16px;font-weight:800;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chead .info .sub{font-size:12.5px;color:var(--txt2);display:flex;align-items:center;gap:5px}
.chead .info .sub.online{color:var(--gold)}
.chat-body{flex:1;overflow-y:auto;padding:18px 20px 8px;position:relative;scroll-behavior:smooth;background-color:var(--bg);background-image:radial-gradient(900px 500px at 88% 4%,rgba(212,175,55,.09),transparent 60%),radial-gradient(700px 460px at 4% 98%,rgba(212,175,55,.07),transparent 60%)}
.msgs{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:3px}
.date-sep{align-self:center;margin:16px 0 10px;padding:5px 16px;border-radius:20px;background:var(--glass);backdrop-filter:blur(8px);border:1px solid var(--line2);font-size:12px;color:var(--txt2);font-weight:600}
.unread-sep{display:flex;align-items:center;gap:10px;margin:14px 0;color:var(--gold);font-size:12px;font-weight:700}
.unread-sep:after,.unread-sep:before{content:'';flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--line))}
.mrow{display:flex;gap:9px;align-items:flex-end;margin-bottom:2px;animation:pop .34s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:none}}
.mrow.me{flex-direction:row-reverse}
.mrow .gap{width:38px;flex:0 0 auto}
.mrow.sel .bub{outline:2px solid var(--gold);outline-offset:2px}
.bub{max-width:min(560px,78%);background:var(--in);border:1px solid var(--line2);border-radius:var(--r-m);padding:8px 12px 7px;position:relative;box-shadow:var(--sh2);word-break:break-word;transition:var(--t)}
.mrow.me .bub{background:var(--out);color:var(--out-txt);border-color:var(--line)}
.bub.tail-in{border-start-start-radius:6px}
.bub.tail-out{border-start-end-radius:6px}
.bub:hover .bact{opacity:1;transform:none}
.bhead{display:flex;align-items:center;gap:7px;margin-bottom:2px}
.bhead .sn{font-weight:800;font-size:13.5px;color:var(--gold)}
.bhead .rl{font-size:10px;padding:1px 6px;border-radius:8px;background:var(--act);color:var(--gold);font-weight:700}
.btxt{white-space:pre-wrap;font-size:14.6px;line-height:1.7}
.btxt a{color:var(--gold);text-decoration:underline}
.btxt.big-emoji{font-size:52px;line-height:1.25;text-align:center;padding:4px 0}
.bmeta{display:flex;align-items:center;gap:6px;justify-content:flex-end;margin-top:2px;font-size:11px;color:var(--txt3);float:left;margin-inline-start:12px}
.mrow.me .bmeta{color:rgba(255,255,255,.62)}
.bmeta .ticks{display:flex;color:inherit}
.bmeta .ticks.read{color:var(--gold)}
.bact{position:absolute;top:-14px;inset-inline-start:8px;display:flex;gap:3px;opacity:0;transform:translateY(5px);transition:var(--t);z-index:4}
.mrow.me .bact{inset-inline-start:auto;inset-inline-end:8px}
.bact button{width:29px;height:29px;border-radius:9px;border:1px solid var(--line2);background:var(--bg3);color:var(--txt2);cursor:pointer;display:grid;place-items:center;transition:var(--t)}
.bact button:hover{color:var(--gold);border-color:var(--gold);transform:translateY(-2px)}
.reacts{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.react{display:flex;align-items:center;gap:4px;padding:2px 9px;border-radius:14px;background:var(--panel);border:1px solid var(--line2);cursor:pointer;font-size:12.5px;transition:var(--t)}
.react:hover{transform:scale(1.08)}
.react.mine{background:var(--act);border-color:var(--gold);color:var(--gold);font-weight:700}
.reply-box{display:flex;gap:8px;padding:5px 9px;margin:-2px -4px 6px;border-radius:10px;background:var(--panel);border-inline-start:3px solid var(--gold);cursor:pointer;transition:var(--t)}
.reply-box:hover{background:var(--hov)}
.reply-box .rc{min-width:0}
.reply-box .rn{font-size:12.5px;font-weight:800;color:var(--gold)}

async function hashPass(p){
if(window.crypto && crypto.subtle){
const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(p));
return [...new Uint8Array(buf)].map(x=>x.toString(16).padStart(2,'0')).join('');
}
let h=5381; for(let i=0;i<p.length;i++) h=((h<<5)+h+p.charCodeAt(i))|0;
return 'x'+(h>>>0).toString(16);
}

if(!validUn(un))return showErr('یوزرنیم: ۵ تا ۳۲ حرف انگلیسی، عدد یا _ و شروع با حرف');
if(pass.length<6)return showErr('رمز عبور باید حداقل ۶ کاراکتر باشد');
if(!RTDB)return showErr('دیتابیس تعریف نشده — صفحه را رفرش کنید');
if(!FB_OK)return showErr('هنوز به دیتابیس متصل نشدیم — چند لحظه صبر کنید');
try{
const unRef=R('usernames/'+un);
const snap=await unRef.once('value');
if(snap.exists())return showErr('❌ این یوزرنیم قبلاً گرفته شده');
const id=uid('u');
const h=await hashPass(pass);
const userData={id,name,username:un,passHash:h,bio:'',avatar:{col:authAv.col,src:authAv.src},createdAt:Date.now(),lastSeen:Date.now(),online:true,blocked:false};
await unRef.set({uid:id});
await R('users/'+id).set(userData);
S.users[id]=userData;
S.me=id;
S.chats['saved_'+id]={id:'saved_'+id,type:'saved',messages:[],unread:0,pinned:false,muted:false,archived:false,createdAt:Date.now()};
DB.save();
startSync();
enterApp();
toast('به Nexo خوش آمدی، '+name+' 👋');
}catch(e){
console.error('Signup error:',e);
showErr('خطا در ساخت حساب: '+(e.message||'دوباره تلاش کنید'));
}
}
async function login(){
const un=norm(document.getElementById('lgUser').value);
const pass=document.getElementById('lgPass').value;
const err=document.getElementById('authErr');err.classList.remove('show');
if(!un)return showErr('یوزرنیم را وارد کنید');
if(!pass)return showErr('رمز عبور را وارد کنید');
if(!RTDB)return showErr('دیتابیس تعریف نشده');
if(!FB_OK)return showErr('هنوز به دیتابیس متصل نشدیم');
try{
const sn=await R('usernames/'+un).once('value');
if(!sn.exists())return showErr('❌ کاربری با این یوزرنیم پیدا نشد');
const uid2=sn.val().uid;
const us=await R('users/'+uid2).once('value');
if(!us.exists())return showErr('حساب پیدا نشد');
const u=us.val();
const h=await hashPass(pass);
if((u.passHash||'')!==h)return showErr('❌ رمز عبور نادرست است');
u.id=uid2;
S.users[uid2]=Object.assign(S.users[uid2]||{},u,{id:uid2});
S.me=uid2;
if(!S.chats['saved_'+uid2])S.chats['saved_'+uid2]={id:'saved_'+uid2,type:'saved',messages:[],unread:0,pinned:false,muted:false,archived:false,createdAt:Date.now()};
DB.save();
startSync();
enterApp();
toast('خوش برگشتی، '+u.name+' 👋');
}catch(e){
console.error('Login error:',e);
showErr('خطا در ورود: '+(e.message||'دوباره تلاش کنید'));
}
}

function matchFolder(c){

const fo=S.folders.find(x=>x.id===f);return fo?(fo.chats||[]).includes(c.id):true;

function beep(){try{const ac=new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.frequency.value=880;g.gain.value=.05;o.start();o.frequency.exponentialRampToValueAtTime(1320,ac.currentTime+.09);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+.25);o.stop(ac.currentTime+.26)}catch(e){}}
/* ============ MEDIA ============ */
function fileToDataURL(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}
function compressImage(file,max=1400,q=.75){
return new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{
let{width:w,height:h}=im;const sc=Math.min(1,max/Math.max(w,h));w=Math.round(w*sc);h=Math.round(h*sc);
const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(im,0,0,w,h);
res({src:cv.toDataURL('image/jpeg',q),w,h})};im.src=r.result};r.readAsDataURL(file)})
}
async function handleImage(f){
const c=chatById(state.chatId);if(!c)return;
toast('در حال آماده‌سازی تصویر…');

}

pushMsg(c,{type:'file',media:{src,name:f.name,size:f.size,mime:f.type}});renderList();
}
let rec=null,recChunks=[],recStart=0,recTimer=null;
async function startRec(){
const c=chatById(state.chatId);if(!c)return;
try{
const stream=await navigator.mediaDevices.getUserMedia({audio:true});
rec=new MediaRecorder(stream);recChunks=[];rec.start();recStart=Date.now();
const bar=document.querySelector('.cbar');bar.dataset.old=bar.innerHTML;
bar.innerHTML=`<div class="rec-ui"><span class="rec-dot"></span><span class="rec-t" id="recT">${fa('00:00')}</span>
<span style="color:var(--txt2);font-size:13px">در حال ضبط…</span></div>
<button class="icon-btn" data-act="cancel-rec" style="color:var(--danger)">${ICO.trash}</button>
<button class="send-btn" data-act="stop-rec">${ICO.send}</button>`;
recTimer=setInterval(()=>{const s=Math.floor((Date.now()-recStart)/1000);const t=document.getElementById('recT');if(t)t.textContent=fa(String(Math.floor(s/60)).padStart(2,'0'))+':'+fa(String(s%60).padStart(2,'0'))},500);
rec.onstop=()=>{stream.getTracks().forEach(t=>t.stop());const blob=new Blob(recChunks,{type:rec.mimeType||'audio/webm'});
const r=new FileReader();r.onload=()=>{pushMsg(c,{type:'voice',media:{src:r.result,dur:(Date.now()-recStart)/1000,size:blob.size}});renderList()};r.readAsDataURL(blob)};
}catch(e){toast('دسترسی به میکروفن داده نشد','err')}
}
function stopRec(cancel){clearInterval(recTimer);if(rec&&rec.state==='recording'){if(cancel){rec.onstop=null;rec.stream.getTracks().forEach(t=>t.stop());rec.stop()}else rec.stop()}
rec=null;const c=chatById(state.chatId);if(c){const bar=document.querySelector('.cbar');if(bar&&bar.dataset.old){bar.innerHTML=bar.dataset.old;delete bar.dataset.old;bindComposer()}}}

let openModals=[];
function modal({title,body,foot,wide,onMount,icon}){
const ov=document.createElement('div');ov.className='overlay';
ov.innerHTML=`<div class="modal ${wide?'wide':''}">
<div class="mhead"><button class="icon-btn" data-act="close-modal">${ICO.close}</button><h3>${icon?`<span style="color:var(--gold);display:flex">${icon}</span>`:''}${title}</h3></div>
<div class="mbody">${body}</div>${foot?`<div class="mfoot">${foot}</div>`:''}</div>`;
ov.addEventListener('click',e=>{if(e.target===ov)closeModal(ov)});
document.getElementById('layer').appendChild(ov);openModals.push(ov);onMount&&onMount(ov);return ov;
}
function closeModal(ov){ov=ov||(openModals[openModals.length-1]);if(!ov)return;ov.style.animation='fade .2s reverse both';setTimeout(()=>ov.remove(),180);openModals=openModals.filter(x=>x!==ov)}
function confirmBox(title,text,onYes,yesLabel='تأیید',danger=true){
modal({title,body:`<p style="margin:0;color:var(--txt2);line-height:2">${esc(text)}</p>`,
foot:`<button class="btn btn-ghost" data-act="close-modal">انصراف</button><button class="btn ${danger?'':'btn-gold'}" id="cfmYes" style="${danger?'background:var(--danger);color:#fff':''}">${yesLabel}</button>`,
onMount:ov=>{document.getElementById('cfmYes',ov).onclick=()=>{closeModal(ov);onYes()}}});
}
function promptBox(title,fields,onOk,okLabel='تأیید'){
const body=fields.map(f=>`<div class="field"><label>${f.label}</label>${f.type==='textarea'?`<textarea class="inp" id="f_${f.k}" rows="3" placeholder="${esc(f.ph||'')}">${esc(f.v||'')}</textarea>`:`<input class="inp" id="f_${f.k}" type="${f.type||'text'}" maxlength="${f.max||60}" value="${esc(f.v||'')}" placeholder="${esc(f.ph||'')}" ${f.dir==='ltr'?'style="direction:ltr;text-align:left"':''}>`}</div>`).join('');
return modal({title,body,foot:`<button class="btn btn-ghost" data-act="close-modal">انصراف</button><button class="btn btn-gold" id="okBtn">${okLabel}</button>`,
onMount:ov=>{
document.getElementById('okBtn',ov).onclick=()=>{const vals={};for(const f of fields){vals[f.k]=(document.getElementById('f_'+f.k,ov).value||'').trim()}
if(onOk(vals,ov)!==false)closeModal(ov)};
setTimeout(()=>{const fi=ov.querySelector('input,textarea');fi&&fi.focus()},120)}});
}

function menuAt(anchor,html,opts={}){
closeMenu();

const r=anchor?anchor.getBoundingClientRect():{left:opts.x||100,top:opts.y||100,right:opts.x||100,bottom:opts.y||100,width:0,height:0};
const mw=m.offsetWidth,mh=m.offsetHeight;
let x=opts.x!=null?opts.x:r.left;let y=opts.y!=null?opts.y:r.bottom+6;
if(x+mw>innerWidth-8)x=innerWidth-mw-8;if(x<8)x=8;
if(y+mh>innerHeight-8)y=Math.max(8,r.top-mh-6);
m.style.left=x+'px';m.style.top=y+'px';curMenu=m;
setTimeout(()=>document.addEventListener('click',outsideMenu,{once:true}),10);
}

function openStoryViewer(uidv){
const list=activeStories(uidv);if(!list.length)return toast('استوری فعالی نیست');
let i=0;
const ov=document.createElement('div');ov.className='story-view';document.getElementById('layer').appendChild(ov);
function show(){
const s=list[i];
if(s.userId!==S.me&&!(s.views||[]).includes(S.me)){(s.views=s.views||[]).push(S.me);DB.save();
if(RTDB&&FB_OK)R('stories/'+s.id+'/views/'+S.me).set(true)}
const u=S.users[s.userId]||me();
ov.innerHTML=`<div class="sv-inner">
<div class="sv-prog">${list.map((_,k)=>`<span class="sp ${k<i?'done':''} ${k===i?'run':''}"><i></i></span>`).join('')}</div>
<div class="sv-head">${avatarHTML(u.avatar,38,u.name)}<div class="sv-hc"><b>${esc(u.name)}</b><span>${relTime(s.createdAt)}</span></div>
<button class="icon-btn" data-sx>${ICO.close}</button></div>
<div class="sv-body ${s.type==='text'?'sv-text':''}" style="${s.type==='text'?`background:${s.bg||SBGS[0]}`:''}">
${s.type==='image'&&s.src?`<img src="${s.src}">`:''}
${s.type==='text'?`<div class="sv-cap">${esc(s.text||'')}</div>`:(s.text?`<div class="sv-cap">${esc(s.text)}</div>`:'')}
</div>
<div class="sv-zone prev" data-zp></div><div class="sv-zone next" data-zn></div>
</div>`;
const runSp=ov.querySelector('.sp.run');
if(runSp)runSp.addEventListener('animationend',e=>{if(e.target.tagName==='I')next()});
else setTimeout(next,5000);
ov.querySelector('[data-sx]').onclick=close;
ov.querySelector('[data-zn]').onclick=next;ov.querySelector('[data-zp]').onclick=prev;
}
function next(){if(i<list.length-1){i++;show()}else close()}
function prev(){if(i>0){i--;show()}else close()}
function close(){svCtl=null;ov.style.animation='fade .2s reverse both';setTimeout(()=>ov.remove(),180);renderList()}
svCtl={next,prev,close};
show();
}
/* ============ VOICE PLAYER ============ */
let audioEl=null;
function playVoice(mid,btn){
const m=findMsg(mid);if(!m||!m.media||!m.media.src)return toast('فایل صوتی در دسترس نیست','err');
if(audioEl){audioEl.pause();audioEl=null;document.querySelectorAll('.vplay').forEach(b=>b.innerHTML=ICO.play)}
audioEl=new Audio(m.media.src);audioEl.play().catch(()=>toast('پخش صوت ممکن نشد','err'));
btn.innerHTML=ICO.stop;
const wave=document.querySelector(`[data-wave="${mid}"]`);const bars=wave?[...wave.querySelectorAll('i')]:[];let idx=0,timer=null;
timer=setInterval(()=>{bars.forEach((b,i)=>b.classList.toggle('a',i<=idx));idx++;if(idx>bars.length)idx=0},Math.max(60,(m.media.dur||1)*1000/bars.length));
audioEl.onended=()=>{clearInterval(timer);btn.innerHTML=ICO.play;bars.forEach(b=>b.classList.remove('a'));audioEl=null};
}

/* ============ FIREBASE SYNC (PRIVATE) ============ */
const Backend={
async sendMessage(chatId,msg){
if(!RTDB||chatId.startsWith('saved_'))return;
if(!FB_OK){toast('اتصال به دیتابیس برقرار نیست','err');return}
R('messages/'+chatId+'/'+msg.id).set(msg);
R('chats/'+chatId).update({updatedAt:Date.now(),lastMsg:{senderId:msg.senderId,type:msg.type,text:(msg.text||'').slice(0,80),createdAt:msg.createdAt,readBy:[msg.senderId]}});
const c=chatById(chatId);
if(c&&c.members){for(const u in c.members){if(u!==msg.senderId)R('chats/'+chatId+'/unread/'+u).transaction(v=>(v||0)+1)}}
},
async publishStory(st){
if(!RTDB||!FB_OK)return;
R('stories/'+st.id).set({userId:st.userId,type:st.type,src:st.src||null,text:st.text||'',bg:st.bg||SBGS[0],createdAt:st.createdAt,views:{}});
}
};
let syncOn=false,curMsgSub=null,prevLastMap={};
function startSync(){
if(syncOn||!RTDB||!S.me)return;syncOn=true;
// فقط چت‌هایی که عضو هستم را بخوان
R('chats').on('value',s=>{
const rem=s.val()||{};
const neededUsers=new Set();
for(const id in rem){
if(id.startsWith('saved_'))continue;
const c=rem[id]||{};
if(!c.members||!c.members[S.me])continue;
const cur=S.chats[id]||{id,messages:[]};
S.chats[id]=Object.assign(cur,{id,type:c.type||'private',peerId:c.peerId||cur.peerId,title:c.title||'',username:c.username||'',about:c.about||'',
avatar:c.avatar||cur.avatar||null,members:c.members,invite:c.invite||'',permissions:c.permissions||{},
pinnedIds:c.pinnedIds||cur.pinnedIds||[],lastMsg:c.lastMsg||null,createdAt:c.createdAt||cur.createdAt||Date.now(),
unread:(c.unread&&c.unread[S.me])||0});
// کاربران مورد نیاز را جمع کن
if(c.members){for(const uid2 in c.members){if(uid2!==S.me)neededUsers.add(uid2)}}
if(c.peerId&&c.peerId!==S.me)neededUsers.add(c.peerId);
const nl=S.chats[id].lastMsg;const nlTs=nl?nl.createdAt:0;
if(!(id in prevLastMap)){prevLastMap[id]=nlTs}
else if(nlTs!==prevLastMap[id]&&nl&&nl.senderId!==S.me&&state.chatId!==id){
notifyIncoming(S.chats[id],{text:nl.text,type:nl.type,senderId:nl.senderId});
}
prevLastMap[id]=nlTs;
}
// فقط کاربران مرتبط را لود کن
neededUsers.forEach(uid2=>{
if(!S.users[uid2]){
R('users/'+uid2).once('value').then(snap=>{
const u=snap.val();
if(u){u.id=uid2;u.known=true;S.users[uid2]=Object.assign(S.users[uid2]||{},u,{id:uid2,known:true});DB.save();renderRail();renderList();}
});
}else if(!S.users[uid2].known){
S.users[uid2].known=true;DB.save();
}
});
renderRail();renderList();if(state.infoOpen)renderInfo();
});
// استوری‌ها فقط برای خودم و مخاطبینم
R('stories').on('value',s=>{
const v=s.val()||{};const arr=[];
for(const id in v){const st=v[id]||{};st.id=id;st.views=st.views?Object.keys(st.views):[];
if(st.userId===S.me||(S.users[st.userId]&&S.users[st.userId].known&&!S.users[st.userId].blocked)){
if(Date.now()-(st.createdAt||0)<864e5)arr.push(st)}
}
S.stories=arr;
renderList();
});
// بلاک‌های من
R('users/'+S.me+'/blocked').on('value',s=>{
const blocked=s.val()||{};
Object.values(S.users).forEach(u=>{if(u.id!==S.me)u.blocked=false});
for(const uid2 in blocked){if(S.users[uid2])S.users[uid2].blocked=true;}
DB.save();renderRail();renderList();
});
// آنلاین بودن من
const meRef=R('users/'+S.me);
meRef.child('online').set(true);
meRef.child('lastSeen').set(firebase.database.ServerValue.TIMESTAMP);
meRef.child('online').onDisconnect().set(false);
meRef.child('lastSeen').onDisconnect().set(firebase.database.ServerValue.TIMESTAMP);
// وضعیت آنلاین مخاطبینم
R('users/'+S.me).once('value').then(()=>{
Object.values(S.users).filter(u=>u.known&&u.id!==S.me).forEach(u=>{
R('users/'+u.id+'/online').on('value',s=>{
if(S.users[u.id]){S.users[u.id].online=!!s.val();renderRail();renderList();if(state.infoOpen)renderInfo();}
});
R('users/'+u.id+'/lastSeen').on('value',s=>{
if(S.users[u.id]&&s.val()){S.users[u.id].lastSeen=s.val();renderList();}
});
});
});
}
function subscribeMessages(cid){
unsubscribeMessages();
if(!RTDB||cid.startsWith('saved_'))return;
const cb=s=>{
const v=s.val()||{};
const arr=Object.values(v).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
const c=chatById(cid);if(!c)return;
c.messages=arr.filter(m=>{
if(m.senderId===S.me)return true;
const sender=S.users[m.senderId];
return !sender || !sender.blocked;
});
const newMsgs=[];
for(const m of c.messages){
if(!renderedMsgIds.has(m.id)){newMsgs.push(m);renderedMsgIds.add(m.id);}
}
const upd={};
c.messages.forEach(m=>{if(m.senderId!==S.me&&!(m.readBy||[]).includes(S.me))upd[m.id+'/readBy/'+S.me]=true});
if(Object.keys(upd).length){
R('messages/'+cid).update(upd);
R('chats/'+cid+'/unread/'+S.me).set(0);
const lm=c.lastMsg;if(lm&&lm.senderId!==S.me)R('chats/'+cid+'/lastMsg/readBy').transaction(a=>{a=a||[];if(!a.includes(S.me))a.push(S.me);return a});
}
c.unread=0;
if(state.chatId===cid){
if(newMsgs.length){
for(const m of newMsgs)appendMessage(m,true);
if(state.stick)stickBottom();
}else if(renderedMsgIds.size===0){
renderMessages();
}
}
renderList();
};
curMsgSub={id:cid,cb};
R('messages/'+cid).on('value',cb);
}
function unsubscribeMessages(){
if(curMsgSub&&RTDB){R('messages/'+curMsgSub.id).off('value',curMsgSub.cb);curMsgSub=null}
}
